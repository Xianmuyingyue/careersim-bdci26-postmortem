<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerSim 典型对局 · 牛马案例集</title>
<style>
  :root{
    --bg:#0b1220; --panel:#131c2e; --panel2:#0f1829; --line:#1f2b42;
    --txt:#e6edf7; --muted:#8b9bb4; --accent:#4ea1ff;
    --lv:#7aa2f7; --sk:#34d399; --wl:#f59e0b; --bad:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:34px 28px 18px;max-width:1240px;margin:0 auto}
  .back{margin-bottom:10px;font-size:12.5px}
  .back a{color:#4ea1ff;text-decoration:none}
  .back a:hover{text-decoration:underline}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:14px}
  .kpis{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
  .kpi b{display:block;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
  .kpi span{color:var(--muted);font-size:12px}
  main{max-width:1240px;margin:0 auto;padding:0 28px 60px}
  .cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:12px;margin:14px 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
  .card:hover{border-color:#31527f;transform:translateY(-2px)}
  .card.on{border-color:var(--accent);background:#152238;
    box-shadow:0 0 0 1px var(--accent) inset}
  .card .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;
    background:#1d2b45;color:#9fc0ee;margin-bottom:8px}
  .card h3{margin:0 0 4px;font-size:15px}
  .card .num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .card .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .board{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 8px}
  .board-head{display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .board-head h2{margin:0;font-size:18px}
  .note{color:var(--muted);font-size:13px;max-width:640px;margin-top:4px}
  canvas{width:100%;height:auto;display:block}
  .ctrl{display:flex;align-items:center;gap:14px;padding:10px 2px 6px;flex-wrap:wrap}
  button{background:#1b2a44;color:var(--txt);border:1px solid #2b3e5e;border-radius:8px;
    padding:7px 15px;cursor:pointer;font-size:14px}
  button:hover{border-color:var(--accent);color:#cfe4ff}
  input[type=range]{flex:1;min-width:180px;accent-color:var(--accent)}
  .mlabel{font-variant-numeric:tabular-nums;color:var(--muted);min-width:52px;
    text-align:right;font-size:14px}
  .state{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
    gap:9px;padding:4px 2px 14px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
  .cell .k{color:var(--muted);font-size:11px}
  .cell .v{font-size:17px;font-variant-numeric:tabular-nums}
  .kill{margin:6px 0 16px;border:1px solid rgba(255,93,93,.42);border-radius:12px;
    background:linear-gradient(180deg,rgba(255,93,93,.10),rgba(255,93,93,.03));
    padding:15px 17px 15px 20px;position:relative}
  .kill::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;
    border-radius:3px;background:var(--bad)}
  .kill .kh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .kill .badge{font-size:11px;font-weight:700;letter-spacing:.6px;color:#fff;
    background:var(--bad);padding:2px 9px;border-radius:99px}
  .kill .when{color:#ffb3b3;font-size:12px;font-variant-numeric:tabular-nums}
  .kill h4{margin:0;font-size:16px}
  .kill .scene{color:#c9d6e8;font-size:13.5px;margin:6px 0 10px}
  .opts{display:grid;gap:8px;margin:10px 0}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:13.5px}
  .opt.picked{border-color:rgba(255,93,93,.55);background:rgba(255,93,93,.10)}
  .opt .mk{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid #54627c;
    margin-top:2px;position:relative}
  .opt.picked .mk{border-color:var(--bad)}
  .opt.picked .mk::after{content:"";position:absolute;inset:3px;border-radius:50%;
    background:var(--bad)}
  .opt .lab{color:var(--txt)}
  .opt .ess{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .opt .flag{font-size:11px;color:#ffb3b3;margin-left:6px}
  .kill .res{font-size:13.5px;color:#ffd7d7;margin-top:8px}
  .kill .cost{font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic}
  .kill.turn{border-color:rgba(52,211,153,.40);
    background:linear-gradient(180deg,rgba(52,211,153,.10),rgba(52,211,153,.03))}
  .kill.turn::before{background:#34d399}
  .kill.turn .badge{background:#2f7d5b}
  .kill.turn .when{color:#9fe8c4}
  .kill.turn .res{color:#c8f0dd}
  .kill.turn .opt.picked{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.10)}
  .kill.turn .opt.picked .mk{border-color:#34d399}
  .kill.turn .opt.picked .mk::after{background:#34d399}
  .kill.turn .opt.picked .flag{color:#9fe8c4}
  footer{max-width:1240px;margin:0 auto;padding:0 28px 44px;color:var(--muted);font-size:12px}
  .legend{display:flex;gap:18px;color:var(--muted);font-size:12px;padding:0 2px 8px;
    flex-wrap:wrap}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;
    vertical-align:middle;margin-right:6px}
</style>
</head>

:21,"o":13.0,"w":8.0,"h":9,"d":10},{"m":22,"l":3,"s":42,"n":21,"o":13.0,"w":9.0,"h":10,"d":10},{"m":23,"l":3,"s":42,"n":21,"o":15.0,"w":9.0,"h":8,"d":10},{"m":24,"l":4,"s":46,"n":20,"o":19.0,"w":11.0,"h":8,"d":10},{"m":25,"l":4,"s":50,"n":23,"o":21.0,"w":11.0,"h":8,"d":10},{"m":26,"l":4,"s":54,"n":24,"o":23.0,"w":12.0,"h":9,"d":10},{"m":27,"l":4,"s":58,"n":25,"o":15.0,"w":11.0,"h":8,"d":8}]}];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cur = 0, month = 48, timer = null;
const COL = {grid:'#1b2740', axis:'#6b7f9c', txt:'#e6edf7', muted:'#8b9bb4',
  lv:'#7aa2f7', sk:'#34d399', wl:'#f59e0b', bad:'#ff5d5d', exec:'#ef4444'};

function resize(){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = Math.round(w * 0.36);
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
const PAD = {l:52,r:20,t:18,b:26};
function dims(){const w=cv.clientWidth,h=cv.clientHeight;
  return {w,h,pw:w-PAD.l-PAD.r,ph:h-PAD.t-PAD.b};}
function xOf(m,d){return PAD.l + (m-1)/47*d.pw;}
function yLv(l,d){return PAD.t + (6-l)/6*d.ph;}
function ySkill(s,d){return PAD.t + (1-Math.min(s,170)/170)*d.ph;}
function yW(w,max,d){return PAD.t + (1-w/max)*d.ph;}

function draw(){
  const c = DATA[cur]; if(!c) return;
  const d = dims();
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
  for(let l=0;l<=6;l++){
    const y = PAD.t + l/6*d.ph;
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(PAD.l+d.pw,y); ctx.stroke();
  }
  ctx.fillStyle = COL.axis; ctx.font = '11px system-ui';
  for(let l=0;l<=6;l++){
    const y = PAD.t + l/6*d.ph;
    ctx.fillText('L'+(6-l), 10, y+4);
  }
  ctx.strokeStyle = '#16233a';
  for(let m=6;m<=48;m+=6){
    const x = xOf(m,d);
    ctx.beginPath(); ctx.moveTo(x,PAD.t); ctx.lineTo(x,PAD.t+d.ph); ctx.stroke();
  }
  const x24 = xOf(24,d);
  ctx.strokeStyle = '#8a9bb5'; ctx.globalAlpha=.55; ctx.setLineDash([3,5]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x24,PAD.t); ctx.lineTo(x24,PAD.t+d.ph); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  const km = c.kill ? c.kill.month : null;
  if(km){
    const xk = xOf(km,d);
    ctx.fillStyle = 'rgba(255,93,93,.10)';
    ctx.fillRect(xk-11, PAD.t, 22, d.ph);
    ctx.strokeStyle = COL.bad; ctx.lineWidth = 2; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(xk,PAD.t); ctx.lineTo(xk,PAD.t+d.ph); ctx.stroke();
    ctx.setLineDash([]);
  }

  const vis = c.traj.filter(t=>t.m<=month);
  if(!vis.length) return;
  const wmax = Math.max(...c.traj.map(t=>t.w),1);
  ctx.strokeStyle = COL.wl; ctx.lineWidth = 2.5; ctx.globalAlpha=.95;
  ctx.beginPath();
  vis.forEach((t,i)=>{const x=xOf(t.m,d), y=yW(t.w,wmax,d); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
  ctx.strokeStyle = COL.sk; ctx.lineWidth = 2.5;
  ctx.beginPath();
  vis.forEach((t,i)=>{const x=xOf(t.m,d), y=ySkill(t.s,d); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
  ctx.strokeStyle = COL.lv; ctx.lineWidth = 4; ctx.lineCap='round';
  vis.forEach(t=>{
    const x1=xOf(t.m,d), x2=xOf(Math.min(t.m+1,48),d);
    const y=yLv(t.l,d);
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
  });
  let prev=null;
  vis.forEach(t=>{
    if(prev!==null && t.l!==prev){
      const x=xOf(t.m,d), y=yLv(t.l,d);
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
      ctx.fillStyle=COL.lv; ctx.fill();
      ctx.fillStyle=COL.txt; ctx.font='11px system-ui';
      ctx.fillText('L'+t.l, x+8, y-7);
    }
    prev=t.l;
  });
  if(km && month>=km){
    const pt = c.traj.find(t=>t.m===km) || c.traj[c.traj.length-1];
    const xk = xOf(km,d), yk = yLv(pt.l,d);
    ctx.beginPath(); ctx.arc(xk,yk,7,0,Math.PI*2);
    ctx.fillStyle='rgba(255,93,93,.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(xk,yk,3.5,0,Math.PI*2);
    ctx.fillStyle=COL.bad; ctx.fill();
    ctx.fillStyle=COL.bad; ctx.font='bold 11px system-ui';
    ctx.fillText((c.kill.kind==='转折'?'★ ':'⚡ ')+'M'+km, xk+9, yk-9);
  }
  const last = vis[vis.length-1];
  const xp = xOf(last.m,d);
  ctx.strokeStyle='#ffffff'; ctx.globalAlpha=.16; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(xp,PAD.t); ctx.lineTo(xp,PAD.t+d.ph); ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle=COL.axis; ctx.font='11px system-ui';
  for(let m=1;m<=48;m+=6) ctx.fillText('M'+m, xOf(m,d)-8, PAD.t+d.ph+16);
}

function renderState(){
  const c=DATA[cur]; if(!c) return;
  const t = c.traj.filter(x=>x.m<=month).pop();
  const box=document.getElementById('state');
  if(!t){box.innerHTML='';return;}
  const items=[['月份','M'+t.m],['职级','L'+t.l],['技能',t.s],['人脉',t.n],
    ['产出',t.o],['财富',t.w.toFixed(1)],['身心',t.h],['尊严',t.d]];
  box.innerHTML = items.map(([k,v])=>
    `<div class="cell"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

function renderKill(){
  const c=DATA[cur], k=c.kill, box=document.getElementById('kill');
  if(!k){box.style.display='none';return;}
  box.style.display='block';
  box.className = 'kill' + (k.kind==='转折' ? ' turn' : '');
  const isTurn = k.kind==='转折';
  const opts = k.opts.map(([lab,ess,pick])=>
    `<div class="opt ${pick?'picked':''}">
       <span class="mk"></span>
       <span class="lab">${lab}${pick?'<span class="flag">← 实际选择</span>':''}
         <span class="ess">${ess}</span></span>
     </div>`).join('');
  box.innerHTML = `
    <div class="kh">
      <span class="badge" style="${isTurn?'background:#2f7d5b':''}">${isTurn?'★ 转折点':'⚡ 斩杀线'}</span>
      <span class="when">第 ${k.month} 个月</span>
      <h4>${k.title}</h4>
    </div>
    <div class="scene">${k.scene}</div>
    <div class="opts">${opts}</div>
    <div class="res">→ ${k.result}</div>
    <div class="cost">${k.cost}</div>`;
}

function renderCards(){
  const box=document.getElementById('cases');
  box.innerHTML = DATA.map((c,i)=>{
    const cls = i===cur?'card on':'card';
    return `<div class="${cls}" data-i="${i}">
      <span class="tag">${c.tag}</span>
      <h3>${c.headline}</h3>
      <div class="num">${c.quant} <span style="font-size:12px;color:#8b9bb4">/ comp ${(c.quant*0.7).toFixed(2)}</span></div>
      <div class="meta">L${c.finalLevel} · ${c.months} 个月 · ${c.outcome==='completed'?'完赛':(c.outcome==='eliminated'?'淘汰':'—')} · ${c.grade}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.card').forEach(el=>{
    el.onclick=()=>{cur=+el.dataset.i; month=48; stop(); sync();};
  });
}

function sync(){
  const c=DATA[cur];
  document.getElementById('bTitle').textContent =
    c.headline + ' · ' + c.quant + ' 分（L' + c.finalLevel + '，' + c.months + ' 个月）';
  document.getElementById('bNote').textContent = c.note;
  const sl=document.getElementById('slider');
  sl.max = c.months; sl.value = month;
  document.getElementById('mlabel').textContent = 'M'+month;
  renderCards(); draw(); renderState(); renderKill();
}

document.getElementById('slider').oninput = e=>{
  month = +e.target.value;
  document.getElementById('mlabel').textContent='M'+month;
  draw(); renderState();
};
document.getElementById('reset').onclick=()=>{
  stop(); month=DATA[cur].months;
  document.getElementById('slider').value=month;
  document.getElementById('mlabel').textContent='M'+month;
  draw(); renderState();
};
document.getElementById('jump').onclick=()=>{
  stop();
  const km = DATA[cur].kill ? DATA[cur].kill.month : Math.round(DATA[cur].months/2);
  month = Math.min(km, DATA[cur].months);
  document.getElementById('slider').value=month;
  document.getElementById('mlabel').textContent='M'+month;
  draw(); renderState();
  document.getElementById('kill').scrollIntoView({behavior:'smooth',block:'center'});
};
function stop(){ if(timer){clearInterval(timer);timer=null;
  document.getElementById('play').textContent='▶ 播放';} }
document.getElementById('play').onclick=function(){
  if(timer){stop();return;}
  if(month>=DATA[cur].months) month=1;
  this.textContent='⏸ 暂停';
  timer=setInterval(()=>{
    month++;
    if(month>=DATA[cur].months){month=DATA[cur].months;stop();}
    document.getElementById('slider').value=month;
    document.getElementById('mlabel').textContent='M'+month;
    draw(); renderState();
  },70);
};
window.addEventListener('resize',resize);
renderCards(); sync(); resize();
</script>
